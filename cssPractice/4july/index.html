           *{

      body{
        margin: 0;
        background-color:#f3f6fb;
    
        
            /* height: 100vh;

      }
      nav{
        display: flex;
        box-sizing: border-box;
        gap:20px;
        padding: 15px 40px;
        align-items: center;
        justify-content: space-between;

        background-color: black;
        color: white;
        z-index: 10;
        position: sticky;
        top:0px;

      }
      .container{
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        /* margin:40px; */
      }
      .card{
        background-color: white;
        width: 250px;
        padding: 20px;
        border: 2px solid black;
        position: relative;
       transition: 0.3s;
    }
    .badge{
        background-color: red;
        position: absolute;
        top: 10px;
        right:10px;
        margin-bottom: 10px;
        color: white;
        padding: 5px 10px;
        border:2px solid black;
    }
    .card:hover{
        transform: translateX(1.5px);
        cursor: pointer;
        box-shadow: 0 2px 3px rgba(0,0,0,0.3);
        
    }
    button{
        background-color: black;
        color: white;
        padding:10px 16px;
        border: none;
        transition: 0.3s;
    }
    button:hover{
        background-color: #333;
    }
    .links{
       
        display: flex;
        gap:20px;

    }
    .links a{
        color: white;
        text-decoration: none;
        font-size: 20px;
        transition: 0.3s;
    }
    .links a:hover{
        color: #ccc;
    }
     
        .grid-container{
            background-color: pink;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            padding: 40px;
            


        }
        .grid-card{
            /* height: 55px;
            width:55px; */
            padding: 20px;
            border: 1px solid #ccc;
            background-color : white;
        }
        /* .screen{
            position: relative;
        } */
        .helpBtn{
            position: fixed;
            bottom: 20px;
            right: 20px;
            height: 50px;
            width: 50px;
            border-radius: 50%;
            background-color: black;
            color: white;

        }
    .overflow-box{
        width: 250px;
        height:100px;
        background-color: white;
        border: 1px solid black;
        padding: 15px;
        margin: 40px;
        object-fit: cover;
        overflow: auto;
    }

}

.form-row {

}
#submit{

}
input,textarea{
    width: 100%;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 16px;
    padding: 12px;
   
}
#message{
   resize: vertical;
  

}
input:focus,
textarea:focus{
    outline:none;
    border-color: black;
}
label{
    display: block;
    margin-bottom: 8px;


}
#contact{
    position: relative;

}
#contact::after{
     content: "";
  position: absolute;
  width: 60px;
  height: 3px;
  background-color: black;
  bottom: -8px;
  left: 30px;

}


    @media (max-width:600px){
        .container{
            display: flex;
            flex-direction: column;
            
            gap:20px;

        }
        .card{
            width: 90%;
        }

        nav{
            display: flex;
            flex-direction: column;
            padding: 15px 20px;

        }
        .links{
            gap: 12px;
            
        }
        .grid-container{
            grid-template-columns: 1fr;
        }

    }
    @media (min-width:601px) and (max-width:900px){

         .grid-container{
            grid-template-columns: 1fr 1fr;
        }
    }
