<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container"> 
        <h1>Mood Movie Finder</h1>
        <P>Select your mood and Get the movie recommendation</P>
    </div>
    <div class="mood-button">
        
        <button   data-mood="Comedy"           >Happy😄</button>
        <button   data-mood="Drame"           >Sad🥲</button>
        <button   data-mood="Action"           >Excited🤩</button>
        <button   data-mood="Romance"           >Romantic🥰</button>
        <button   data-mood="Horror"           >Scared👻</button>
    </div>
    <div id="movies-container"></div>
    
<script src="script.js"></script>
</body>
</html>
