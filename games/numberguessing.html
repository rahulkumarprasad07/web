<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var a=Math.floor(Math.random()*6)+1
        while(true){
            let guess=prompt("enter no 1 to 6")
            if(a==guess){
                alert("you won!!")
                break;
            }else{
                alert("better luck next time")
            }

        }
    </script>
    
</body>
</html>
