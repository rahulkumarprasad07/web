<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>piano</title>
    <style>
        #main{
            display: flex;
            flex-direction: column;
            align-items: center;
            
        }
        #allKeys{
            display: flex;
             gap: 20px;
             margin-top: 30px;
            
        }
        .key{
            display: flex;
            justify-content: center;
            border: 1px solid black;
            height: 100px;
            width: 20px;
            cursor: pointer;
            transition: 0.3s;
            transform-origin: top;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.4);

           
        }
        .key:hover{
            transform: scale(1.1);
            background-color: black;
            color: white;
            box-shadow: 2px 2px 8px rgba(255,255,255,1);

        }
        #piano{
            
            border: 1px solid black;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.4);
            border-radius: 2px;
            margin: 2px;
            
        }
       

    </style>
</head>
<body>
    <div id="main">
        <div id="piano">PIANO</div>
           <div id="allKeys">
           <div class="key"   data-note="C"        >C</div>
           <div class="key"   data-note="D"        >D</div>
           <div class="key"   data-note="E"        >E</div>
           <div class="key"   data-note="F"        >F</div>
           <div class="key"   data-note="G"        >G</div>
           <div class="key"   data-note="A"        >A</div>
           <div class="key"   data-note="B"        >B</div>
           </div>
           
       
    </div>
    <audio  id="audio-C"        src="u_c58whxla22-a-piano-a4-422104.mp3"></audio>
    <audio  id="audio-D"        src="u_c58whxla22-b-piano-b4-422106.mp3"></audio>
    <audio  id="audio-E"        src="u_c58whxla22-e-piano-e4-422092.mp3"></audio>
    <audio  id="audio-F"        src="u_c58whxla22-f-piano-f4-422101.mp3"></audio>
    <audio  id="audio-G"        src="u_op8btczor7-piano-c-508248.mp3"></audio>
    <audio  id="audio-A"        src="u_op8btczor7-piano-f-508249.mp3"></audio>
    <audio  id="audio-B"        src="frost_games-relaxing-piano-loop-523375.mp3"></audio>




    <script>
        const keys=document.querySelectorAll(".key")
        keys.forEach( function(e){
            const note= e.getAttribute("data-note")
            const audio=document.getElementById("audio-"+note)

            e.addEventListener('mouseover',function(){
                audio.currentTime=0
                audio.play()
                  
                setTimeout( function(){
                    audio.pause();
                    audio.currentTime=0;},1000);
                })
            })
        
    </script>
   
    
</body>
</html>
